name: Release

# Turns a version into a tag and a GitHub release whose notes are the changelog
# entry the player reads. Two ways in:
# - called by CI (job `release`) after the deploy of main has been verified: the
#   tag is the version in package.json, put on the deployed commit. A pull
#   request that changes the game has moved that version (`pnpm check:version`),
#   so each such deploy gets its own release; one that changes nothing else
#   finds its release already there and stops.
# - a pushed tag vX.Y.Z, by hand: it becomes a release only when it matches both
#   package.json and CURRENT_VERSION in src/data/changelog.ts.
# Two jobs, so the game's dependencies never run next to a token that can write
# to the repository: `notes` installs them, checks the tag against both version
# sources (`pnpm release:notes`) and hands the notes over as an artifact;
# `release` installs nothing and only talks to GitHub. Tags are never moved or
# deleted.
on:
  push:
    tags: ["v*"]
  workflow_call:

permissions: {}

jobs:
  notes:
    name: notes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The tag of this release
        id: tag
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then tag="$GITHUB_REF_NAME"; else tag="v$(jq -r .version package.json)"; fi
          echo "tag=$tag" | tee -a "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          check-latest: true # newest patch of the .nvmrc line; no bot updates .nvmrc
          # No dependency cache: the notes feed a job that holds a write token.
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Check the tag and write release notes
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: pnpm --silent release:notes "$TAG" > "$RUNNER_TEMP/notes.md"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes-${{ github.sha }}
          path: ${{ runner.temp }}/notes.md
          retention-days: 7
          overwrite: true # a rerun of this job in the same run writes it again

  release:
    name: release
    needs: [notes]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # gh release create
    # Two releases created at once must not race.
    concurrency:
      group: release
      cancel-in-progress: false
    env:
      TAG: ${{ needs.notes.outputs.tag }}
    steps:
      # Done when the release exists. A tag on another commit (pushed by hand, or left by an earlier run)
      # is never moved and never given this commit's release: `gh release create` would attach to it.
      - name: Already released
        id: done
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName > /dev/null 2>&1; then
            echo "::notice::$TAG is already released; nothing to do."
            echo "released=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The peeled commit of an annotated tag, or the commit of a lightweight one.
          # A missing tag is an error answer, whose body gh prints too: only a success names a commit.
          tagged=""
          if answer=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha 2> /dev/null); then tagged="$answer"; fi
          if [ -n "$tagged" ] && [ "$tagged" != "$GITHUB_SHA" ]; then
            echo "::warning::$TAG already points to $tagged, not to $GITHUB_SHA; no release is created."
            echo "released=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.done.outputs.released != 'true'
        with:
          name: release-notes-${{ github.sha }}
          path: ${{ runner.temp }}
      - name: Create the release
        if: steps.done.outputs.released != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then where=(--verify-tag); else where=(--target "$GITHUB_SHA"); fi
          create() {
            gh release create "$TAG" "${where[@]}" --repo "$GITHUB_REPOSITORY" \
              --title "Deadline Day ${TAG#v}" --notes-file "$RUNNER_TEMP/notes.md"
          }
          released() { gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName > /dev/null 2>&1; }
          # The API can fail after it has created the release: judge by whether it exists, and try once more.
          create || released || { sleep 10; create || released; }
          { echo "### Release"; echo; echo "- $TAG on $GITHUB_SHA"; } >> "$GITHUB_STEP_SUMMARY"

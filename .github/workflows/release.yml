name: Release

# A pushed tag vX.Y.Z becomes a GitHub release only when it matches both
# package.json and CURRENT_VERSION in src/data/changelog.ts. The notes come
# from that changelog entry, so the release says what the player was told.
# The version test in `pnpm test` keeps the two sources equal on every
# commit; this job refuses a tag that points anywhere else.
on:
  push:
    tags: ["v*"]

permissions: {}

# Two tags pushed together must not race to create releases.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # gh release create
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # No dependency cache here: a cache written by a pull request run
          # must never feed a job that holds a write token.
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Check the tag and write release notes
        run: pnpm --silent release:notes "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          --title "Deadline Day ${GITHUB_REF_NAME#v}"
          --notes-file "$RUNNER_TEMP/notes.md"
          --verify-tag

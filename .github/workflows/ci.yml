name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to a pull request cancels its older run. Runs on main are never cancelled: one may be
# publishing the game (job deploy), and cancelling it would stop an upload half way.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The full local gate. Git hooks only guard commits made on a machine that
  # ran `pnpm install`; this is the gate nothing can skip.
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read # the changed-file list and the live pull request title
      actions: read # artifacts left by pull request runs (.github/scripts/ci-gate.sh)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The commit and its first parent (in a pull request the merge commit and the head of main): the
          # version check compares the two.
          fetch-depth: 2
      # Skips the heavy steps for a documentation-only pull request, and for a
      # push to main whose tree a pull request run already passed.
      - name: Skip what a pull request already verified on this tree
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash .github/scripts/ci-gate.sh verify
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          check-latest: true # newest patch of the .nvmrc line; no bot updates .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Formatting and text rules (documentation-only pull request)
        if: steps.gate.outputs.docs_only == 'true'
        run: |
          pnpm format:check
          pnpm check:text
      - name: Lint, format, text rules, conventions, typecheck, tests with coverage, quality
        if: steps.gate.outputs.full == 'true'
        run: pnpm verify
      - name: Audit production dependencies
        if: steps.gate.outputs.full == 'true'
        run: pnpm audit --prod
      - name: Audit all dependencies (report only)
        if: steps.gate.outputs.full == 'true'
        run: pnpm audit
        continue-on-error: true
      - name: Build production bundle
        if: steps.gate.outputs.full == 'true'
        run: pnpm build
      - name: Check bundle size budget
        if: steps.gate.outputs.full == 'true'
        run: pnpm check:bundle
      # The deploy job runs only on main, after a merge. A pull request that changes the tool, the headers
      # or the workflows tries them here, without credentials: the tool installs from its own lockfile and
      # accepts the configuration and the built package. An unreadable file list tries them too.
      # Decided in its own step: the token stays out of the next one, which runs the pull request's tool.
      - name: Does the deployment need a dry run
        id: dry
        if: steps.gate.outputs.full == 'true' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if changed=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename') &&
            ! grep -qE '^(deploy/|public/_headers$|\.github/workflows/)' <<< "$changed"; then
            echo "Nothing the deployment reads changed; skipped."
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: The deployment tool accepts the package (dry run)
        if: steps.dry.outputs.needed == 'true'
        working-directory: deploy
        env:
          WRANGLER_SEND_METRICS: "false"
        run: |
          pnpm install --frozen-lockfile
          pnpm exec wrangler deploy --dry-run --message "$GITHUB_SHA"
      # The title becomes the commit on main when the pull request is squashed.
      # Read live rather than from the event, so a rerun after fixing the title
      # sees the new one. Last, and run even after an earlier failure: a bad
      # title used to stop the job before lint and tests reported anything.
      # It still runs before the pass artifact, which only a green job leaves.
      - name: Check the pull request title
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .title | pnpm exec commitlint
      # A pull request that changes the game moves the version by the step its title names (`pnpm
      # version:bump`); any other keeps it. In a pull request the title is read live, as above, so a rerun
      # after renaming it sees the new step. On main the squashed commit's subject is that title and its
      # parent the commit before: two pull requests that took the same number both pass on their own, and
      # the second one fails here, before it deploys, instead of shipping with its release missing.
      - name: Check the version against the title and the changes
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            title=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .title)
          else
            title=$(git log -1 --format=%s)
          fi
          pnpm --silent check:version --base HEAD^1 --title "$title"
      # Read by ci-gate.sh on the push to main that follows the merge.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'pull_request' && steps.gate.outputs.full == 'true'
        with:
          name: ci-passed-verify-${{ steps.gate.outputs.tree }}
          path: ${{ runner.temp }}/verified-tree.txt
          retention-days: 14
          overwrite: true

  # Separate job because it is slow and needs browsers; it does not wait for
  # verify, so both results arrive together. A documentation-only pull
  # request, or a push to main whose tree a pull request already verified,
  # stops after the gate, so the job costs one minute.
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read # the changed-file list
      actions: read # artifacts left by pull request runs (.github/scripts/ci-gate.sh)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Skips the heavy steps for a documentation-only pull request, and for a
      # push to main whose tree a pull request run already passed.
      - name: Skip what a pull request already verified on this tree
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash .github/scripts/ci-gate.sh e2e
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.gate.outputs.full == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.gate.outputs.full == 'true'
        with:
          node-version-file: .nvmrc
          check-latest: true # newest patch of the .nvmrc line; no bot updates .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.gate.outputs.full == 'true'
      # Browsers are cached per Playwright version; the system packages they
      # need are not, so a cache hit still installs those.
      - name: Read the Playwright version
        id: playwright
        if: steps.gate.outputs.full == 'true'
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" | tee -a "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        if: steps.gate.outputs.full == 'true'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Playwright browsers
        if: steps.gate.outputs.full == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium webkit
      - name: Install Playwright system dependencies
        if: steps.gate.outputs.full == 'true' && steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium webkit
      - name: Smoke journeys and accessibility scan (Chromium and WebKit)
        if: steps.gate.outputs.full == 'true'
        run: pnpm test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() && steps.gate.outputs.full == 'true'
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      # Read by ci-gate.sh on the push to main that follows the merge.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'pull_request' && steps.gate.outputs.full == 'true'
        with:
          name: ci-passed-e2e-${{ steps.gate.outputs.tree }}
          path: ${{ runner.temp }}/verified-tree.txt
          retention-days: 14
          overwrite: true

  # Builds the package that deploy publishes, in a job without credentials: the game's dependencies and
  # their build scripts never run next to the Cloudflare token. On a push, verify may have skipped its own
  # build because a pull request already verified this tree; the build is deterministic, so building that
  # verified tree again gives the same package.
  build-release:
    name: build-release
    needs: [verify, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          check-latest: true # newest patch of the .nvmrc line; no bot updates .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: List every file of the package with its checksum
        run: find dist -type f -print0 | sort -z | xargs -0 sha256sum > dist.sha256
      # Named after the commit, so deploy can only take the package of its own run and commit.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ github.sha }}
          path: |
            dist/
            dist.sha256
          if-no-files-found: error
          retention-days: 7

  # Publishes the package from build-release to Cloudflare Workers static assets. Only on a push to main,
  # after both required jobs succeeded, and only while the repository variable DEPLOY_ENABLED is "true";
  # any other value pauses publishing (before a rollback, for example). Not a required check: a pull
  # request never reaches it.
  deploy:
    name: deploy
    needs: [build-release]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    # Read by the release job: true only once the host serves this build.
    outputs:
      verified: ${{ steps.served.outcome == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The credentials live in this environment, restricted to main in the repository settings.
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    # One publication at a time, never cancelled once started. The head check below covers a run that
    # waited here while main moved on.
    concurrency:
      group: production-deployment
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The address and the credentials are set
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ -z "$PRODUCTION_URL" ]; then
            echo "::error::The repository variable PRODUCTION_URL is not set; nothing is published."; exit 1
          fi
          if [ "$HAS_TOKEN" != "true" ] || [ "$HAS_ACCOUNT" != "true" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is empty; nothing is published."; exit 1
          fi
      # A run that waited, or is run again later, must not put an older commit over a newer one.
      - name: This commit is still the head of main
        id: head
        run: |
          head=$(git ls-remote origin refs/heads/main | cut -f1)
          # An empty answer is a failed question, not a branch that has moved on.
          if [ -z "$head" ]; then
            echo "::error::The head of main could not be read; nothing is published."; exit 1
          fi
          if [ "$head" = "$GITHUB_SHA" ]; then
            echo "current=true" | tee -a "$GITHUB_OUTPUT"
          else
            echo "current=false" | tee -a "$GITHUB_OUTPUT"
            echo "::notice::main has moved on from this commit; nothing is published."
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.head.outputs.current == 'true'
        with:
          name: release-${{ github.sha }}
      - name: The package is the one built for this commit, file for file
        if: steps.head.outputs.current == 'true'
        run: |
          sha256sum --check --strict --quiet dist.sha256
          test "$(find dist -type f | wc -l)" -eq "$(wc -l < dist.sha256)"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.head.outputs.current == 'true'
      # No dependency cache: what is restored into this job would run next to the credentials. Only the
      # deployment tool is installed here, never the game's dependencies.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.head.outputs.current == 'true'
        with:
          node-version-file: .nvmrc
          check-latest: true # newest patch of the .nvmrc line; no bot updates .nvmrc
          package-manager-cache: false
      # The same content as the served release is not published again; other content needs a version
      # above the served one (scripts/served-release.mjs). Node built-ins only: nothing is installed for it.
      - name: Compare with the served release
        id: compare
        if: steps.head.outputs.current == 'true'
        run: node scripts/served-release.mjs compare "$PRODUCTION_URL"
      - name: Install the deployment tool from its lockfile
        if: steps.head.outputs.current == 'true' && steps.compare.outputs.same_content != 'true'
        working-directory: deploy
        run: pnpm install --frozen-lockfile
      - name: Publish
        id: publish
        if: steps.head.outputs.current == 'true' && steps.compare.outputs.same_content != 'true'
        working-directory: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          set -o pipefail # a failed deploy must fail the step, not vanish into tee
          pnpm exec wrangler deploy --message "$GITHUB_SHA" | tee "$RUNNER_TEMP/wrangler.log"
          # The id a rollback names (.github/workflows/rollback.yml).
          id=$(grep -oE 'Current Version ID: [0-9a-f-]+' "$RUNNER_TEMP/wrangler.log" | cut -d' ' -f4 || true)
          if [ -z "$id" ]; then echo "::warning::No version id in the output of wrangler; find it in the dashboard for a rollback."; fi
          echo "version_id=$id" >> "$GITHUB_OUTPUT"
      # Every file the served worker lists, with its bytes, and release.json from this commit: what the
      # players' browsers will install. Retried, since the host can mix old and new files for a while.
      # Also when nothing was published because the host already serves this content: then the release
      # is checked whole without its commit, and the release job can still create a release an earlier
      # run left missing.
      - name: The served game is this release, whole
        id: served
        if: steps.publish.outcome == 'success' || steps.compare.outputs.same_content == 'true'
        env:
          PUBLISHED: ${{ steps.publish.outcome }}
        run: |
          commit=()
          if [ "$PUBLISHED" = "success" ]; then commit=(--source-sha "$GITHUB_SHA"); fi
          node scripts/served-release.mjs check "$PRODUCTION_URL" "${commit[@]}" --wait-s 180
          curl -fsSI "$PRODUCTION_URL/" | grep -i '^content-security-policy:'
      - name: Report
        if: ${{ !cancelled() }}
        env:
          CURRENT: ${{ steps.head.outputs.current }}
          SAME: ${{ steps.compare.outputs.same_content }}
          PUBLISHED: ${{ steps.publish.outcome }}
          VERSION_ID: ${{ steps.publish.outputs.version_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$CURRENT" != "true" ]; then result="not published: main has moved on or could not be read"
          elif [ "$SAME" = "true" ]; then result="not published: the host already serves this content"
          elif [ "$PUBLISHED" = "success" ]; then result="published"
          else result="not published: see the failed step"; fi
          {
            echo "### Deployment: $result (job $JOB_STATUS, commit $GITHUB_SHA)"
            if [ -n "$VERSION_ID" ]; then echo; echo "- Version, for a rollback: \`$VERSION_ID\`"; fi
          } >> "$GITHUB_STEP_SUMMARY"

  # The tag and the GitHub release follow the verified deploy, in a job of their own: it alone may write
  # to the repository, and it never sees the host credentials. The release workflow decides the tag from
  # package.json and does nothing when that version is already released (a change that ships nothing).
  release:
    name: release
    needs: [deploy]
    if: needs.deploy.outputs.verified == 'true'
    permissions:
      contents: write
    uses: $/.github/workflows/release.yml
